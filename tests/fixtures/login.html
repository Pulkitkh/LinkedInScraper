<!doctype html>
<html><head><meta charset="utf-8"><title>LinkedIn Login</title></head>
<body>
<form onsubmit="event.preventDefault(); submitLogin();">
  <input id="username" name="session_key" type="text">
  <input id="password" name="session_password" type="password">
  <div id="error-for-password" style="display:none"></div>
  <button type="submit">Sign in</button>
</form>
<script>
function submitLogin() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  if (u === 'operator@example.com' && p === 'correct-password') {
    document.cookie = 'li_at=fake-session; path=/';
    window.location.href = '/feed/';
  } else if (u === 'needs2fa@example.com') {
    window.location.href = '/checkpoint/challenge/abc';
  } else {
    const e = document.getElementById('error-for-password');
    e.innerText = 'Wrong email or password. Try again.';
    e.style.display = 'block';
  }
}
</script>
</body></html>
